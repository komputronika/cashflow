<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catatan Keuangan</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f7f7f7;
    }
    .saldo {
      font-size: 1.6rem;
      font-weight: bold;
    }
    .trx-plus {
      color: #198754;
    }
    .trx-minus {
      color: #dc3545;
    }
  </style>
</head>
<body>

<div class="container py-3">

  <!-- Tombol -->
  <div class="d-flex gap-2 mb-3">
    <button class="btn btn-success w-50" onclick="openForm('in')">Pemasukan</button>
    <button class="btn btn-danger w-50" onclick="openForm('out')">Pengeluaran</button>
  </div>

  <!-- Saldo -->
  <div class="card mb-2">
    <div class="card-body text-center">
      <div class="text-muted">Saldo Saat Ini</div>
      <div class="saldo" id="saldo">Rp 0</div>
    </div>
  </div>

  <!-- Export -->
  <div class="d-grid mb-3">
    <button class="btn btn-outline-primary" onclick="exportCSV()">Export CSV</button>
  </div>

  <!-- Filter -->
  <div class="d-flex gap-2 mb-3">
    <input type="date" id="filterDate" class="form-control">
    <input type="month" id="filterMonth" class="form-control">
  </div>

  <!-- List -->
  <ul class="list-group" id="trxList"></ul>

</div>

<!-- Modal -->
<div class="modal fade" id="trxModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle"></h5>
      </div>
      <div class="modal-body">
        <input type="number" id="amount" class="form-control mb-2" placeholder="Nominal">
        <input type="text" id="note" class="form-control" placeholder="Keterangan">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
        <button class="btn btn-primary" onclick="saveTrx()">Simpan</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
let type = 'in';
let editIndex = null;
let data = JSON.parse(localStorage.getItem('trx')) || [];

const modal = new bootstrap.Modal(document.getElementById('trxModal'));
const amountInput = document.getElementById('amount');
const note = document.getElementById('note');

function openForm(t) {
  type = t;
  editIndex = null;
  document.getElementById('modalTitle').innerText =
    t === 'in' ? 'Pemasukan' : 'Pengeluaran';
  amountInput.value = '';
  note.value = '';
  modal.show();
}

function saveTrx() {
  const amount = Number(amountInput.value);
  if (!amount) return;

  if (editIndex !== null) {
    data[editIndex].amount = amount;
    data[editIndex].note = note.value;
  } else {
    data.push({
      type,
      amount,
      note: note.value,
      date: new Date().toISOString().slice(0,10)
    });
  }

  localStorage.setItem('trx', JSON.stringify(data));
  modal.hide();
  render();
}

function editTrx(i) {
  editIndex = i;
  const t = data[i];
  type = t.type;

  document.getElementById('modalTitle').innerText =
    type === 'in' ? 'Edit Pemasukan' : 'Edit Pengeluaran';

  amountInput.value = t.amount;
  note.value = t.note;
  modal.show();
}

function deleteTrx(i) {
  if (!confirm('Hapus transaksi ini?')) return;
  data.splice(i, 1);
  localStorage.setItem('trx', JSON.stringify(data));
  render();
}

function render() {
  const list = document.getElementById('trxList');
  list.innerHTML = '';

  let saldo = 0;
  const fDate = filterDate.value;
  const fMonth = filterMonth.value;

  data
    .filter(t => {
      if (fDate) return t.date === fDate;
      if (fMonth) return t.date.startsWith(fMonth);
      return true;
    })
    .forEach((t, i) => {
      saldo += t.type === 'in' ? t.amount : -t.amount;

      list.innerHTML = `
        <li class="list-group-item">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div>${t.note || '-'}</div>
              <small class="text-muted">${t.date}</small>
            </div>
            <div class="text-end">
              <div class="${t.type === 'in' ? 'trx-plus' : 'trx-minus'}">
                ${t.type === 'in' ? '+' : '-'}Rp ${t.amount.toLocaleString()}
              </div>
              <div class="btn-group btn-group-sm mt-1">
                <button class="btn btn-outline-secondary" onclick="editTrx(${i})">Edit</button>
                <button class="btn btn-outline-danger" onclick="deleteTrx(${i})">Hapus</button>
              </div>
            </div>
          </div>
        </li>
      ` + list.innerHTML;
    });

  document.getElementById('saldo').innerText =
    'Rp ' + saldo.toLocaleString();
}

filterDate.onchange = () => {
  filterMonth.value = '';
  render();
};

filterMonth.onchange = () => {
  filterDate.value = '';
  render();
};

function exportCSV() {
  let csv = 'Tanggal,Tipe,Nominal,Keterangan\n';
  data.forEach(t => {
    csv += `${t.date},${t.type},${t.amount},"${t.note || ''}"\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'catatan-keuangan.csv';
  a.click();
  URL.revokeObjectURL(url);
}

render();
</script>

</body>
</html>
